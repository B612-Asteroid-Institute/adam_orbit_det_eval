[project]
name = "adam_orbit_det_eval"
dynamic = ["version"]
description = "Data and scripts for evaluation of the ADAM orbit determination libraries"
readme = "README.md"
requires-python = ">=3.11,<3.13"
classifiers = [
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
license = { file = "LICENSE.md" }

keywords = ["astronomy", "orbital mechanics", "orbit determination"]

dependencies = [
  # Tier-2 pins for the v2 run (2026-06-16):
  # - adam_core e6f89108 = main after PR #198 merge (e48 warm-start ABC).
  # - adam_fo b10b622 = kk/v2-prep-fitter-resilience tip (beads 5h7 + 589 plus
  #   refinements: placeholder-semantics tightening d0d939c/6db76fd, UTC
  #   rejected-obs comparison d15771f, formatting). Pushed but NOT merged —
  #   branch-SHA pinning pending Tier-2 review follows the e48/9sg precedent
  #   (2026-05-05). Validated end-to-end by pilot v14 (2026-06-12).
  "adam_core @ git+https://github.com/B612-Asteroid-Institute/adam_core.git@e6f89108",
  "adam_fo @ git+https://github.com/B612-Asteroid-Institute/adam_fo.git@b10b622",
  "adam_assist",
  "numpy>=2.0.0",
  "pyarrow>=13.0.0",
  "quivr>=0.8.1",
  "mpc-obscodes>=2026.3.25",
  "mpcq @ git+https://github.com/B612-Asteroid-Institute/mpcq.git@42e447b",
  # EFCC18 catalog-debiasing preprocessing (scripts/preprocess_efcc18.py, bead
  # 54t): HEALPix tile lookup at NSIDE=64 over debias_2018.tgz.
  "healpy>=1.16.0",
  "ipykernel",
  "ipywidgets",
  "matplotlib>=3.10.1",
  "plotly",
  "nbformat>=4.2.0",
  "google-cloud-bigquery>=3.40.1",
  "google-cloud-storage>=3.10.1",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
[project.urls]
"Documentation" = "https://github.com/B612-Asteroid-Institute/adam_orbit_det_eval#README.md"
"Issues" = "https://github.com/B612-Asteroid-Institute/adam_orbit_det_eval/issues"
"Source" = "https://github.com/B612-Asteroid-Institute/adam_orbit_det_eval"


[dependency-groups]
test = [
    "pytest-benchmark",
    "pytest-cov",
    "pytest-doctestplus",
    "pytest-mock",
    "pytest-xdist",
    "pytest",
    "isort",
    "mypy",
    "ruff",
    "black",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
norecursedirs = ["__pypackages__", ".claude", ".venv", ".git", "data", "logs", "reports"]

[tool.ruff]
line-length = 110
target-version = "py311"
lint.ignore = []
exclude = ["build"]

[tool.pdm.build]
includes = ["src/adam_orbit_det_eval/"]
excludes = [
  "**/__pycache__/**",
  "**/*.py[cod]",
  "**/*.nbc",
  "**/*.nbi",
  "**/.DS_Store",
]

[tool.pdm.version]
source = "scm"
write_to = "adam_orbit_det_eval/_version.py"
write_template = "__version__ = '{}'"


[tool.pdm.scripts]
check = { composite = ["lint", "typecheck", "test"] }
format = { composite = ["black ./src/adam_orbit_det_eval", "isort ./src/adam_orbit_det_eval"] }
lint = { composite = [
  "ruff check ./src/adam_orbit_det_eval",
  "black --check ./src/adam_orbit_det_eval",
  "isort --check-only ./src/adam_orbit_det_eval",
] }
fix = "ruff check ./src/adam_orbit_det_eval --fix"
typecheck = "mypy --strict ./src/adam_orbit_det_eval"

test = "pytest --benchmark-skip -m 'not profile' {args}"
doctest = "pytest --doctest-plus --doctest-only"
benchmark = "pytest --benchmark-only {args}"
coverage = "pytest --benchmark-skip --cov=adam_orbit_det_eval --cov-report=xml -m 'not profile' {args}"
